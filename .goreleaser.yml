version: 2

env:
  - GO111MODULE=on
  - CGO_ENABLED=0

git:
  tag_sort: -version:refname
  ignore_tags:
    - refactor-start

before:
  hooks:
    - go mod verify
    - ./scripts/manpages.sh
    - ./scripts/completions.sh

builds:
  - id: gz
    binary: gz
    main: ./cmd/gz
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/gizzahub/gzh-cli/internal/version.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64

archives:
  - id: default
    ids:
      - gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - completions/*
      - manpages/*

homebrew_casks:
  - name: gz
    ids:
      - default
    binaries:
      - gz
    repository:
      owner: Gizzahub
      name: homebrew-tap
      branch: main
    # 업로드는 서명 검증을 마친 로컬 publisher만 수행한다.
    skip_upload: true
    url:
      template: "https://github.com/Gizzahub/gzh-cli/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    directory: Casks
    homepage: https://github.com/Gizzahub/gzh-cli
    description: "CLI tool for managing development environments and Git repositories"
    license: MIT
    hooks:
      post:
        # GoReleaser v2.19 deprecated the Ruby `install` hook (Homebrew's
        # `postflight`) for the declarative `install_steps` DSL.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/gz"]
          end

checksum:
  name_template: "checksums.txt"

sboms:
  # `cmd: syft` is GoReleaser's default; it is spelled out here because the
  # release job pins an exact syft version and fail-fast checks for it.
  - artifacts: archive
    cmd: syft

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^test:"
      - "^chore"
      - "^docs:"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: "New Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 100
    - title: "Security Updates"
      regexp: '^.*?sec(\([[:word:]]+\))??!?:.+$'
      order: 150
    - title: "Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 200
    - title: "Performance Improvements"
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 250
    - title: "Dependency Updates"
      regexp: '^.*?(feat|fix)\(deps\)!?:.+$'
      order: 300
    - title: "Documentation Updates"
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 400
    - title: "Other Changes"
      order: 9999

release:
  github:
    owner: Gizzahub
    name: gzh-cli
  # GoReleaser는 산출물만 만든다. GitHub 게시 권한은 받지 않는다.
  disable: true
  draft: true
  prerelease: auto
  mode: keep-existing
  header: |
    ## gz {{ .Tag }} ({{ .Date }})

    Welcome to this new release!
  footer: |
    ## Thanks!

    Those were the changes on {{ .Tag }}!

    **Full Changelog**: https://github.com/Gizzahub/gzh-cli/compare/{{ .PreviousTag }}...{{ .Tag }}

# Announcements are fail-closed disabled.
#
# Enabling them requires the provider-specific credential names of the pinned
# GoReleaser version (SLACK_WEBHOOK / DISCORD_WEBHOOK_ID + DISCORD_WEBHOOK_TOKEN),
# an owner for those secrets, and a documented behaviour for missing/invalid
# credentials. Until that is approved, both stay `enabled: "false"` so a missing
# secret can never turn into a half-announced release.
announce:
  slack:
    enabled: "false"
    message_template: "gz {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}"
  discord:
    enabled: "false"
    message_template: "gz {{ .Tag }} has been released! 🎉"

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
