name: Pinned release tools
description: Install and validate the workflow's existing release toolchain pins
inputs: {}
runs:
  using: composite
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: ${{ env.COSIGN_VERSION }}
    - name: Install syft
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        syft-version: ${{ env.SYFT_VERSION }}
    - name: Install GoReleaser
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        distribution: goreleaser
        version: ${{ env.GORELEASER_VERSION }}
        install-only: true
    - name: Validate exact versions and configuration
      shell: bash
      run: |
        set -euo pipefail
        found_goreleaser="$(goreleaser --version | awk '/^GitVersion:/ { print $2 }')"
        found_syft="$(syft version -o json | jq -r '.version')"
        found_cosign="$(cosign version --json | jq -r '.gitVersion')"
        check_version() {
          local tool=$1 found=$2 expected=$3
          if [[ -z "$found" || "$found" == null || "${found#v}" != "${expected#v}" ]]; then
            echo "::error title=Release toolchain mismatch::$tool version does not match its declared pin" >&2
            exit 1
          fi
        }
        check_version goreleaser "$found_goreleaser" "$GORELEASER_VERSION"
        check_version syft "$found_syft" "$SYFT_VERSION"
        check_version cosign "$found_cosign" "$COSIGN_VERSION"
        goreleaser check
        goreleaser healthcheck
