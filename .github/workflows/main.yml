name: Main CI/CD Pipeline
'on':
  push:
    branches: [master, main]
    paths: ['**/*.go', go.mod, go.sum, go.work, .golangci.yml, .gosec.json, .make/**, .github/workflows/main.yml,
      cmd/**/AGENTS.md, cmd/AGENTS_COMMON.md, docs/bulk-clone-schema.json, examples/repo-config/**, examples/synclone/synclone-example.yaml,
      scripts/check-agents.sh, Makefile, mise.toml, .github/actions/main-test/**, .github/actions/main-quality/**,
      .github/actions/main-vulncheck/**, .github/actions/main-benchmark/**, .github/actions/main-build/**]
  pull_request:
    branches: [master, main, develop]
    paths: ['**/*.go', go.mod, go.sum, go.work, .golangci.yml, .gosec.json, .make/**, .github/workflows/**, cmd/**/AGENTS.md,
      cmd/AGENTS_COMMON.md, docs/bulk-clone-schema.json, examples/repo-config/**, examples/synclone/synclone-example.yaml,
      scripts/check-agents.sh, Makefile, mise.toml, .github/actions/main-test/**, .github/actions/main-quality/**,
      .github/actions/main-vulncheck/**, .github/actions/main-benchmark/**, .github/actions/main-build/**]
permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CACHE_VERSION: v1
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest",
          "macos-latest", "windows-latest"]') }}
      fail-fast: false
    steps:
    - {name: Checkout, uses: actions/checkout@v7, with: {fetch-depth: 0}}
    - name: Run test checks
      uses: ./.github/actions/main-test
      with:
        os: ${{ matrix.os }}
        default-shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash -e {0}' }}
  quality:
    name: Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    if: success()
    steps:
    - {name: Checkout, uses: actions/checkout@v7, with: {fetch-depth: 0}}
    - name: Run quality checks
      uses: ./.github/actions/main-quality
    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: gosec-report.json
      if: always() && hashFiles('gosec-report.json') != ''
    - name: Upload security artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: security-reports
        path: |
          gosec-report.json
          lint-report.xml
  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    steps:
    - {uses: actions/checkout@v7}
    - name: Run vulncheck checks
      uses: ./.github/actions/main-vulncheck
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [test, quality]
    if: (github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'perf')) || contains(github.event.head_commit.message,
      '[benchmark]') || contains(github.event.head_commit.message, 'perf:')
    timeout-minutes: 30
    steps:
    - {name: Checkout, uses: actions/checkout@v7, with: {fetch-depth: 0}}
    - name: Run benchmark checks
      uses: ./.github/actions/main-benchmark
      id: benchmark-run
    - name: Generate benchmark report
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "# 📈 Performance Benchmark Report"
          echo ""
          echo "**Commit:** \`${{ github.sha }}\`"
          echo "**Date:** $(date)"
          echo "**Trigger:** ${{ github.event_name }}"
          echo ""
          echo "## 🎯 Benchmark Results"
          echo "\`\`\`"
          shopt -s nullglob
          successful_results=(benchmark_[1-5].txt)
          if ((${#successful_results[@]} > 0)); then
            cat "${successful_results[@]}" > all_benchmarks.txt
            ./bin/tools/benchstat all_benchmarks.txt
          else
            : > all_benchmarks.txt
            echo "No benchmark results found or all benchmarks failed"
          fi
          echo "\`\`\`"
        } > benchmark_report.md
    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results
        path: |
          benchmark_*.txt
          benchmark_failure_*.log
          benchmark_report.md
          all_benchmarks.txt
    - name: Fail on benchmark errors
      if: always() && steps.benchmark-run.outputs.failures != '0'
      run: exit 1
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          try {
            const report = fs.readFileSync('benchmark_report.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
          } catch (error) {
            console.log('Could not read benchmark report:', error);
          }
  build:
    name: Build & Test Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, quality]
    if: success()
    steps:
    - {name: Checkout, uses: actions/checkout@v7}
    - name: Run build checks
      uses: ./.github/actions/main-build
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, quality, build]
    if: always()
    steps:
    - name: Check job results
      run: |
        echo "🔍 Checking job results..."
        echo "Test job: ${{ needs.test.result }}"
        echo "Quality job: ${{ needs.quality.result }}"
        echo "Build job: ${{ needs.build.result }}"

        if [ "${{ needs.test.result }}" != "success" ]; then
          echo "❌ Tests failed"
          exit 1
        fi

        if [ "${{ needs.quality.result }}" != "success" ]; then
          echo "❌ Quality checks failed"
          exit 1
        fi

        if [ "${{ needs.build.result }}" != "success" ]; then
          echo "❌ Build failed"
          exit 1
        fi

        echo "✅ All required jobs passed successfully!"
    - name: Generate job summary
      run: |
        echo "## 🎉 CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Tests | ${{ needs.test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Quality | ${{ needs.quality.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
