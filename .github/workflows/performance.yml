name: Performance Benchmarks

# 동시 실행 제어: 성능 테스트는 순차적으로 실행
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # 성능 테스트는 취소하지 않고 완료

# Global environment variables for caching
env:
  CACHE_VERSION: v1

on:
  pull_request:
    branches: [master, main, develop]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.make/**'
      - '.github/workflows/performance.yml'

  push:
    branches: [master, main, develop]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.make/**'
      - '.github/workflows/performance.yml'

  workflow_dispatch:
    inputs:
      package_pattern:
        description: 'Package pattern to benchmark'
        required: false
        default: './...'
      regression_threshold:
        description: 'Performance regression threshold (%)'
        required: false
        default: '15.0'

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.7'
        cache: true

    - name: Cache benchstat tool
      uses: actions/cache@v5
      with:
        path: bin/tools
        key: ${{ env.CACHE_VERSION }}-benchstat-pin-${{ runner.os }}-${{ hashFiles('Makefile', '.make/tools.mk') }}
        restore-keys: |
          ${{ env.CACHE_VERSION }}-benchstat-pin-${{ runner.os }}-

    - name: Install dependencies
      run: go mod download

    - name: Compile check
      shell: bash
      run: |
        set -euo pipefail
        echo "Checking if all packages compile..."
        go build -v ./...
        echo "Checking if tests compile (per package)..."
        while IFS= read -r pkg; do
          echo "Testing compilation for $pkg"
          go test -run '^$' "$pkg"
        done < <(go list ./...)
        echo "✅ Compilation checks completed!"

    - name: Install benchstat
      run: make install-benchstat

    - name: Run benchmarks
      id: benchmark-run
      shell: bash
      run: |
        set -uo pipefail
        PACKAGE_PATTERN="${{ github.event.inputs.package_pattern || './...' }}"
        echo "Running benchmarks for: $PACKAGE_PATTERN"

        failures=0
        for i in {1..5}; do
          echo "Benchmark run $i/5"
          attempt_output="benchmark_attempt_${i}.log"
          if go test -bench=. -benchmem -run=^$ $PACKAGE_PATTERN 2>&1 | tee "$attempt_output"; then
            mv "$attempt_output" "benchmark_${i}.txt"
          else
            mv "$attempt_output" "benchmark_failure_${i}.log"
            echo "::error::Benchmark run $i/5 failed; its output is retained in benchmark_failure_${i}.log"
            failures=$((failures + 1))
          fi
        done
        echo "failures=$failures" >> "$GITHUB_OUTPUT"

    - name: Generate benchmark report
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "# Performance Benchmark Report"
          echo ""
          echo "**Commit:** \`${{ github.sha }}\`"
          echo "**Date:** $(date)"
          echo ""
          echo "## Benchmark Results"
          echo "\`\`\`"
          shopt -s nullglob
          successful_results=(benchmark_[1-5].txt)
          if ((${#successful_results[@]} > 0)); then
            cat "${successful_results[@]}" > all_benchmarks.txt
            ./bin/tools/benchstat all_benchmarks.txt
          else
            : > all_benchmarks.txt
            echo "No benchmark results found or all benchmarks failed"
          fi
          echo "\`\`\`"
        } > benchmark_report.md

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results
        path: |
          benchmark_*.txt
          benchmark_failure_*.log
          benchmark_report.md
          all_benchmarks.txt

    - name: Fail on benchmark errors
      if: always() && steps.benchmark-run.outputs.failures != '0'
      run: exit 1

    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('benchmark_report.md', 'utf8');

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: report
          });
