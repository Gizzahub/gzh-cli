name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # .make/tools.mk와 같은 기존 pin을 유지한다.
  GORELEASER_VERSION: v2.19.0
  SYFT_VERSION: v1.51.1
  COSIGN_VERSION: v3.1.3
  GOMAXPROCS: "2"
  GOWORK: "off"

jobs:
  verify-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Install and validate pinned release tools
        uses: ./.github/actions/release-tools
      - name: Test artifact handoff rejection paths
        run: go test -race -count=1 ./scripts/releaseartifact
      - name: Build unsigned non-publishing snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          goreleaser release --snapshot --clean --skip=publish --parallelism=2
          go run ./scripts/releaseartifact prepare --snapshot --dir dist --sha "$GITHUB_SHA"
      - name: Upload unsigned preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-preview
          path: dist/publish/*
          if-no-files-found: error

  build-tag:
    # 공개 로그에 남는 서명은 승인된 태그의 push에서만 수행한다.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Install and validate pinned release tools
        uses: ./.github/actions/release-tools
      - name: Test artifact handoff rejection paths
        run: go test -race -count=1 ./scripts/releaseartifact
      - name: Build tag without publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --exit-code
          goreleaser release --clean --skip=publish --parallelism=2
          git diff --exit-code
          go run ./scripts/releaseartifact prepare --dir dist --tag "$GITHUB_REF_NAME" --sha "$GITHUB_SHA"
      - name: Sign final checksums and verify exact workflow identity
        run: |
          set -euo pipefail
          cosign sign-blob --bundle dist/publish/checksums.txt.sigstore.json --yes dist/publish/checksums.txt
          go run ./scripts/releaseartifact verify --dir dist/publish --tag "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" --cosign "$(command -v cosign)"
      - name: Upload signed tag build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-tag-build
          path: dist/publish/*
          if-no-files-found: error
